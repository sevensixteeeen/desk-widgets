# Builds the installer on GitHub's Windows machines when a version tag (v0.5.5) is pushed, signs it
# for the updater, and attaches it to a draft release with latest.json, the file installed apps
# read to find new versions (src-tauri/src/update.rs). Publishing the draft makes it the update.
# Steps: PROJECT_NOTES.md → "Publishing a release".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload to it

# Every action is pinned to an exact commit (the version it was is in the comment): a tag like @v1
# can be moved to new code, and this job hands that code the update signing key. To update one,
# look up the commit of its new release and replace both.
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16

      # Keeps compiled dependencies between runs: about 3 minutes instead of 10+.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private half of tauri.conf.json → plugins.updater.pubkey. Without it the build fails.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Desk Widgets __VERSION__
          releaseDraft: true
          updaterJsonPreferNsis: true
          # Only the setup.exe, plus its .sig for the updater (local builds skip both).
          args: --config src-tauri/tauri.release.conf.json
